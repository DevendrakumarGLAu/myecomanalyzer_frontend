
<div class="card border-0 shadow-sm">

  <div class="card-body">

    <!-- Title -->
    <h5 class="text-center mb-3">Upload Order Status</h5>

    <!-- File Upload -->
    <div class="mb-3">
      <input type="file"
             class="form-control"
             (change)="onFileSelected($event)"
             accept=".csv" />
    </div>

    <!-- Upload Button -->
    <div class="d-grid mb-3">
      <button class="btn btn-primary btn-sm" (click)="uploadFile()">
        ⬆ Upload CSV
      </button>
    </div>

    <!-- Message -->
    <p *ngIf="message" class="text-success text-center">
      {{ message }}
    </p>

    <!-- ERROR LIST -->
    <div *ngIf="errorList.length > 0" class="mt-3">

      <h6 class="text-danger">
        Errors
        <span class="badge bg-danger">{{ errorList.length }}</span>
      </h6>

      <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
        <table class="table table-sm table-bordered table-hover">
          <thead class="table-light sticky-top">
            <tr>
              <th>Row</th>
              <th>Sub Order ID</th>
              <th>Reason</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let err of errorList">
              <td>{{ err.row }}</td>
              <td>{{ err.sub_order_id || '-' }}</td>
              <td class="text-danger fw-semibold">{{ err.reason }}</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <!-- NOT FOUND LIST -->
    <div *ngIf="notFoundList.length > 0" class="mt-4">

      <h6 class="text-warning">
        Orders Not Found
        <span class="badge bg-warning text-dark">{{ notFoundList.length }}</span>
      </h6>

      <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
        <table class="table table-sm table-bordered table-hover">
          <thead class="table-light sticky-top">
            <tr>
              <th>Sub Order ID</th>
              <th>Reason</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of notFoundList">
              <td>{{ item.sub_order_id }}</td>
              <td class="text-warning fw-semibold">{{ item.reason }}</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</div>
