<div class="modal d-block" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h5 class="modal-title">{{ mode }} Product</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="cancel()">
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">

        <!-- ===================== -->
        <!-- KEEP YOUR EXISTING CODE -->
        <!-- ===================== -->

        <div class="container-fluid p-2 overflow-auto">

          <div class="card p-2 border-0 shadow-none">
            <form [formGroup]="form" (ngSubmit)="submit()">

              <div class="row g-3">

                <!-- Upper fields -->
                <ng-container *ngFor="let field of fields">
                  <div class="col-md-6"
                    *ngIf="!['size','cost_price','selling_price','shipping_cost','rto_cost','stock'].includes(field.key)"
                    [class.col-12]="field.key==='sku'||field.key==='name'">

                    <label class="form-label">{{ field.label }}</label>

                    <ng-container [ngSwitch]="field.type">

                      <input *ngSwitchCase="'text'" [formControlName]="field.key" class="form-control"
                        [placeholder]="field.placeholder || ('Enter ' + field.label)" />

                      <input *ngSwitchCase="'number'" type="number" [formControlName]="field.key" class="form-control"
                        [placeholder]="field.placeholder" />

                      <select *ngSwitchCase="'select'" [formControlName]="field.key" class="form-select"
                        (change)="onFieldChange(field.key)">

                        <option value="" disabled>
                          {{ field.placeholder || ('Select ' + field.label) }}
                        </option>

                        <option *ngFor="let opt of field.options" [value]="opt.value">
                          {{ opt.label }}
                        </option>

                      </select>

                    </ng-container>

                    <!-- Custom Color -->
                    <div *ngIf="field.key==='color' && form.get('color')?.value==='OTHER'" class="mt-2">

                      <input type="text" formControlName="custom_color" class="form-control"
                        placeholder="Enter Custom Color" />

                    </div>

                    <!-- Error -->
                    <div class="text-danger mt-1" *ngIf="form.get(field.key)?.invalid && form.get(field.key)?.touched">

                      {{ field.label }} is required

                    </div>

                  </div>
                </ng-container>

              </div>

              <hr class="my-3">

              <!-- Variants -->
              <div class="table-responsive mt-3" formArrayName="variants">

                <table class="table table-bordered align-middle text-center">

                  <thead class="table-light">
                    <tr>
                      <th>Size</th>
                      <th>Cost Price</th>
                      <th>Selling Price</th>
                      <th>Shipping Cost</th>
                      <th>RTO Cost</th>
                      <th>Stock</th>
                      <th style="width:90px;">Action</th>
                    </tr>
                  </thead>

                  <tbody>

                    <tr *ngFor="let variant of variantsArray.controls; let i = index" [formGroupName]="i">

                      <td>
                        <input type="text" formControlName="size" class="form-control form-control-sm"
                          placeholder="Size (L,M,S)" [readonly]="isEditMode" [class.readonly-input]="isEditMode" />
                      </td>

                      <td>
                        <input type="number" formControlName="cost_price" class="form-control form-control-sm"
                          placeholder="Cost Price" />
                      </td>

                      <td>
                        <input type="number" formControlName="selling_price" class="form-control form-control-sm"
                          placeholder="Selling Price" />
                      </td>

                      <td>
                        <input type="number" formControlName="shipping_cost" class="form-control form-control-sm"
                          placeholder="Shipping Cost" />
                      </td>

                      <td>
                        <input type="number" formControlName="rto_cost" class="form-control form-control-sm"
                          placeholder="RTO Cost" />
                      </td>

                      <td>
                        <input type="number" formControlName="stock" class="form-control form-control-sm"
                          placeholder="Stock" />
                      </td>

                      <td>
                        <button type="button"
                          class="btn btn-danger btn-sm rounded-circle d-flex align-items-center justify-content-center"
                          (click)="removeVariant(i)" *ngIf="variantsArray.length > 1" style="width:32px;height:32px;">

                          <i class="fas fa-trash"></i>

                        </button>

                      </td>

                    </tr>

                  </tbody>

                </table>

                <button type="button" class="btn btn-primary th-primary  btn-sm my-2" (click)="addVariant()">

                  <i class="fa fa-plus"></i>
                  Add Row

                </button>

              </div>

              <!-- Footer -->
              <hr>

              <div class="d-flex justify-content-end gap-2 mt-4">

                <button type="button" class="btn btn-secondary" (click)="cancel()">

                  Cancel

                </button>

                <button type="submit" class="btn btn-primary th-primary" [disabled]="form.invalid">

                  {{ mode }}

                </button>

              </div>

            </form>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>
