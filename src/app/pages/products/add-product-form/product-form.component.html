<div class="modal d-block" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h5 class="modal-title">{{ mode }} Product</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="cancel()">
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">

        <!-- ===================== -->
        <!-- KEEP YOUR EXISTING CODE -->
        <!-- ===================== -->

        <div class="container-fluid p-2 overflow-auto">

          <div class="card p-2 border-0 shadow-none">
            <form [formGroup]="form" (ngSubmit)="submit()">

              <div class="row g-3">

                <!-- Upper fields -->
                <ng-container *ngFor="let field of fields">
                  <div class="col-md-6"
                    *ngIf="!['size','cost_price','selling_price','shipping_cost','rto_cost','stock'].includes(field.key)"
                    [class.col-12]="field.key==='sku'||field.key==='name'">

                    <label class="form-label">{{ field.label }}</label>

                    <ng-container [ngSwitch]="field.type">

                      <input *ngSwitchCase="'text'" [formControlName]="field.key" class="form-control"
                        [placeholder]="field.placeholder || ('Enter ' + field.label)" />

                      <input *ngSwitchCase="'number'" type="number" [formControlName]="field.key" class="form-control"
                        [placeholder]="field.placeholder" />

                      <select *ngSwitchCase="'select'" [formControlName]="field.key" class="form-select"
                        (change)="onFieldChange(field.key)">

                        <option value="" disabled>
                          {{ field.placeholder || ('Select ' + field.label) }}
                        </option>

                        <option *ngFor="let opt of field.options" [value]="opt.value">
                          {{ opt.label }}
                        </option>

                      </select>

                    </ng-container>

                    <!-- Custom Color -->
                    <div *ngIf="field.key==='color' && form.get('color')?.value==='OTHER'" class="mt-2">

                      <input type="text" formControlName="custom_color" class="form-control"
                        placeholder="Enter Custom Color" />

                    </div>

                    <!-- Error -->
                    <div class="text-danger mt-1" *ngIf="form.get(field.key)?.invalid && form.get(field.key)?.touched">

                      {{ field.label }} is required

                    </div>

                  </div>
                </ng-container>

              </div>

              <hr class="my-3">
              <div class="row mb-3">
                <div class="col-12">
                  <label class="form-label">Product Image</label>

                  <div class="image-upload-zone" [class.has-image]="imagePreview" [class.dragging]="isDragging"
                    (click)="!uploading && fileInputRef.click()" (dragover)="onDragOver($event)"
                    (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">

                    <input #fileInputRef type="file" accept="image/*" hidden (change)="onImageSelected($event)"
                      (click)="$event.stopPropagation()" />

                    <div *ngIf="uploading" class="upload-state">
                      <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
                      <span class="ms-2 text-primary small fw-medium">Uploading...</span>
                    </div>

                    <ng-container *ngIf="!uploading">
                      <div *ngIf="imagePreview" class="image-preview-wrap">
                        <img [src]="imagePreview" class="image-preview" alt="Product image" />
                        <button type="button" class="image-remove-btn" (click)="removeImage($event)"
                          title="Remove image">
                          <i class="fas fa-times"></i>
                        </button>
                        <div class="image-hover-hint">
                          <i class="fas fa-pen me-1"></i>Change
                        </div>
                      </div>

                      <div *ngIf="!imagePreview" class="upload-placeholder">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <p class="mb-0 fw-semibold small">Click or drag an image to upload</p>
                        <p class="text-muted mb-0 upload-hint">PNG or JPG, up to 5MB</p>
                      </div>
                    </ng-container>
                  </div>
                </div>

              </div>

              <!-- Variants -->
              <div class="table-responsive mt-3" formArrayName="variants">

                <table class="table table-bordered align-middle text-center">

                  <thead class="table-light">
                    <tr>
                      <th>Size</th>
                      <th>Cost Price</th>
                      <th>Selling Price</th>
                      <th>Shipping Cost</th>
                      <th>RTO Cost</th>
                      <th>Stock</th>
                      <th style="width:90px;">Action</th>
                    </tr>
                  </thead>

                  <tbody>

                    <tr *ngFor="let variant of variantsArray.controls; let i = index" [formGroupName]="i">

                      <td>
                        <input type="text" formControlName="size" class="form-control form-control-sm"
                          placeholder="Size (L,M,S)" />
                        <!-- [readonly]="isSizeReadonly(i)"
                          [class.readonly-input]="isSizeReadonly(i)" -->
                      </td>

                      <!-- <td>
                        <input type="number" formControlName="cost_price" class="form-control form-control-sm"
                          placeholder="Cost Price" />
                      </td> -->
                      <td>
                        <input type="number" formControlName="cost_price" class="form-control form-control-sm"
                          placeholder="Cost Price" />

                        <div class="mt-2"
                          *ngIf="variant.get('cost_price')?.value !=variant.get('original_cost_price')?.value">
                          <label class="small text-danger">
                            Effective From
                          </label>

                          <input type="date" formControlName="effective_from"
                            class="form-control form-control-sm border-danger text-danger"
                            (change)="onEffectiveDateChange(i)" />
                        </div>
                      </td>

                      <td>
                        <input type="number" formControlName="selling_price" class="form-control form-control-sm"
                          placeholder="Selling Price" />
                      </td>

                      <td>
                        <input type="number" formControlName="shipping_cost" class="form-control form-control-sm"
                          placeholder="Shipping Cost" />
                      </td>

                      <td>
                        <input type="number" formControlName="rto_cost" class="form-control form-control-sm"
                          placeholder="RTO Cost" />
                      </td>

                      <td>
                        <input type="number" formControlName="stock" class="form-control form-control-sm"
                          placeholder="Stock" />
                      </td>

                      <td>
                        <button type="button"
                          class="btn btn-danger btn-sm rounded-circle d-flex align-items-center justify-content-center"
                          (click)="removeVariant(i)" *ngIf="variantsArray.length > 1" style="width:32px;height:32px;">

                          <i class="fas fa-trash"></i>

                        </button>

                      </td>

                    </tr>

                  </tbody>

                </table>
                <button type="button" class="btn btn-primary th-primary  btn-sm my-2" (click)="addVariant()">
                  <i class="fa fa-plus"></i>
                  Add Row
                </button>
              </div>
              <!-- Footer -->
              <hr>

              <div class="d-flex justify-content-end gap-2 mt-4">

                <button type="button" class="btn btn-secondary" (click)="cancel()">

                  Cancel

                </button>

                <button type="submit" class="btn btn-primary th-primary"  [disabled]="form.invalid || uploading">

                  {{ mode }}

                </button>

              </div>

            </form>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>
