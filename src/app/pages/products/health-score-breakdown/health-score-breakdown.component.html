<div class="p-4">
  <div class="d-flex justify-content-between align-items-start mb-3">
    <div>
      <h5 class="mb-0">{{ data.score.product_name }}</h5>
      <span class="text-muted small">Product Health Score</span>
    </div>
    <div class="text-end">
      <div class="fw-bold" style="font-size: 1.8rem; line-height: 1;">{{ data.score.health_score }}</div>
      <span class="badge" [style.background-color]="barColor(data.score.health_score)">Grade {{ data.score.grade }}</span>
    </div>
  </div>

  <div *ngFor="let f of factors" class="mb-3">
    <div class="d-flex justify-content-between small mb-1">
      <span class="fw-semibold">{{ f.label }} <span class="text-muted">({{ f.weight }}%)</span></span>
      <span>{{ f.score }}/100</span>
    </div>
    <div class="progress" style="height: 8px;">
      <div class="progress-bar" [style.width.%]="f.score" [style.background-color]="barColor(f.score)"></div>
    </div>
    <div class="text-muted small mt-1">{{ f.detail }}</div>
  </div>

  <div class="text-end mt-3">
    <button type="button" class="btn btn-secondary btn-sm" (click)="close()">Close</button>
  </div>
</div>
