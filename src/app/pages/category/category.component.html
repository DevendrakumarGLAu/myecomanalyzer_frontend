<div class="container m-4">

  <!-- Top Row -->
  <div class="row mb-3 align-items-center">
    <div class="col-md-3">
      <input type="text" class="form-control" placeholder="Search category..." [(ngModel)]="searchText"
        (input)="loadCategories()" />
    </div>

    <div class="col-md-9 text-end">
      <button class="btn" [style.background-color]="colors.buttons.add" style="color: white;" (click)="openDialog()">
        <i class="fas fa-plus me-1"></i> Add Category
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="card shadow-sm">
    <div class="card-body p-0" style="max-height: 500px; overflow-y: auto;">
      <table class="category-table table table-bordered table-hover mb-0">
          <thead class="table-light position-sticky" style="top: 0; z-index: 10;">
            <tr>
              <th width="15%" class="text-center">Actions</th>
              <th width="10%">ID</th>
              <th width="40%">Name</th>
              <th width="20%">Status</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let cat of categories">
              <!-- Actions Dropdown -->
              <td class="text-center align-middle">
                <div class="dropdown">
                  <button class="btn btn-sm btn-link text-dark" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">
                    <i class="fas fa-ellipsis-h"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                      <button class="dropdown-item" (click)="openDialog(cat)">
                        <i class="fas fa-pencil-alt text-primary me-2"></i>Edit
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" (click)="deactivateCategory(cat.id)">
                        <i class="fas fa-trash text-danger me-2"></i>Delete
                      </button>
                    </li>
                  </ul>
                </div>
              </td>

              <td class="align-middle">{{ cat.id }}</td>
              <td class="align-middle">{{ cat.name }}</td>
              <td class="align-middle">
                <span class="badge" [ngClass]="cat.is_active ? 'bg-success' : 'bg-danger'">
                  {{ cat.is_active ? 'Active' : 'Inactive' }}
                </span>
              </td>
            </tr>

            <!-- No Data -->
            <tr *ngIf="categories.length === 0">
              <td colspan="4" class="text-center text-muted py-4">
                No categories found
              </td>
            </tr>
          </tbody>
        </table>
    </div>
  </div>
  <!-- Pagination -->
  <div class="d-flex justify-content-end mt-4">
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0 align-items-center">
        <!-- Go To Page -->
        <li class="page-item d-flex align-items-center me-3">
          <span class="me-1 small">Page</span>
          <input type="number" class="form-control form-control-sm" style="width: 70px;" [value]="page" min="1"
            [max]="totalPages" (change)="goToPageInput($event)">
        </li>

        <!-- Page Size -->
        <li class="page-item d-flex align-items-center ms-3">
          <span class="me-1 small">Show</span>
          <select class="form-select form-select-sm" [value]="limit" (change)="onPageSizeChange($event)">
            <option *ngFor="let size of pageSizes" [value]="size">
              {{ size }}
            </option>
          </select>
        </li>

        <!-- Showing Records -->
        <li class="page-item disabled me-3">
          <span class="page-link border-0 bg-transparent text-muted">
            Show: {{ startRecord }} - {{ endRecord }} of {{ total }}
          </span>
        </li>

        <!-- Previous -->
        <li class="page-item" [class.disabled]="page === 1">
          <a class="page-link" href="javascript:void(0)" (click)="prevPage()">&laquo;</a>
        </li>

        <!-- Current -->
        <li class="page-item active">
          <span class="page-link">{{ page }}</span>
        </li>

        <!-- Next -->
        <li class="page-item" [class.disabled]="page === totalPages">
          <a class="page-link" href="javascript:void(0)" (click)="nextPage()">&raquo;</a>
        </li>
      </ul>
    </nav>
  </div>

</div>
