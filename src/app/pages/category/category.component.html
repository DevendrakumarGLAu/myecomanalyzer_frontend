<div class="container m-4">

  <!-- Top Row -->
  <div class="row mb-3 align-items-center">
    <div class="col-md-3">
      <input type="text" class="form-control" placeholder="Search category..." [(ngModel)]="searchText"
        (input)="onSearch()" />
    </div>

    <div class="col-md-9 text-end">
      <button class="btn th-primary" (click)="openDialog()">
        <i class="fas fa-plus me-1"></i> Add Category
      </button>
    </div>
  </div>

  <!-- Table Card -->
  <div class="saas-card">
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height: 420px; overflow-y: auto;">
        <table class="table saas-table mb-0">
          <thead>
            <tr>
              <th class="th-primary">Actions</th>
              <th class="th-primary">ID</th>
              <th class="th-primary">Name</th>
              <th class="th-primary">Status</th>
            </tr>
          </thead>

          <tbody>
            <!-- SKELETON LOADER -->
            <ng-container *ngIf="loading">
              <tr *ngFor="let row of [1,2,3]">
                <td><div class="skeleton-cell w-60"></div></td>
                <td><div class="skeleton-cell w-40"></div></td>
                <td><div class="skeleton-cell w-70"></div></td>
                <td><div class="skeleton-cell w-40"></div></td>
              </tr>
            </ng-container>

            <ng-container *ngIf="!loading">
            <tr *ngFor="let cat of categories">
              <!-- Actions Dropdown -->
              <td class="text-center align-middle">
                <div class="dropdown">
                  <button class="btn btn-sm btn-link text-dark" type="button" data-bs-toggle="dropdown"
                    data-bs-auto-close="outside">
                    <i class="fas fa-ellipsis-h"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                      <button class="dropdown-item" (click)="openDialog(cat)">
                        <i class="fas fa-pencil-alt text-primary me-2"></i>
                      </button>
                    </li>
                    <li>
                      <button class="dropdown-item" (click)="deactivateCategory(cat.id)">
                        <i class="fas fa-trash text-danger me-2"></i>
                      </button>
                    </li>
                  </ul>
                </div>
              </td>

              <td>{{ cat.id }}</td>
              <!-- <td>{{ cat.name }}</td> -->
              <td>
                <span class="first-column" (click)="openDialog(cat)" [title]="'Edit ' + cat.name">
                  {{ cat.name }}
                </span>
              </td>
              <!-- <td >
                <span class="badge" [ngClass]="cat.is_active ? 'bg-success' : 'bg-danger'">
                  {{ cat.is_active ? 'Active' : 'Inactive' }}
                </span>
              </td> -->
              <td>
                <span class="status-badge" [ngClass]="cat.is_active ? 'is-active' : 'is-inactive'">
                  {{ cat.is_active ? 'Active' : 'Inactive' }}
                </span>
              </td>
            </tr>

            <!-- No Data -->
            <tr *ngIf="categories.length === 0">
              <td colspan="4" class="text-center py-4">
                No data found
              </td>
            </tr>
            </ng-container>
          </tbody>
        </table>
      </div>

    </div>
    <!-- Pagination -->
    <div class="saas-pagination-wrapper">
      <nav aria-label="Page navigation">
        <ul class="pagination pagination-sm mb-0 align-items-center flex-nowrap">
          <!-- Go To Page -->
          <li class="page-item d-flex align-items-center me-2">
            <span class="me-1 small text-nowrap">Go</span>
            <input type="number" class="form-control form-control-sm pg-input" style="width: 70px;" [value]="page"
              min="1" [max]="totalPages" (change)="goToPageInput($event)">
          </li>

          <!-- Page Size -->
          <li class="page-item d-flex align-items-center me-2">
            <span class="me-1 small text-nowrap">Show</span>
            <select class="form-select form-select-sm size-select" [value]="limit" (change)="onPageSizeChange($event)">
              <option *ngFor="let size of pageSizes" [value]="size">
                {{ size }}
              </option>
            </select>
          </li>

          <!-- Showing Records -->
          <li class="page-item disabled me-1">
            <span class="page-link border-0 bg-transparent text-muted text-nowrap px-1 record-info">
              {{ startRecord }} - {{ endRecord }} of {{ total }}
            </span>
          </li>

          <!-- Previous -->
          <li class="page-item" [class.disabled]="page === 1">
            <a class="page-link" href="javascript:void(0)" (click)="prevPage()">
              <i class="fa fa-chevron-left"></i>
            </a>

          </li>

          <!-- Current -->
          <li class="page-item active">
            <span class="page-link">{{ page }}</span>
          </li>

          <!-- Next -->
          <li class="page-item" [class.disabled]="page === totalPages">
            <a class="page-link" href="javascript:void(0)" (click)="nextPage()">
              <i class="fa fa-chevron-right"></i>
            </a>
          </li>
        </ul>
      </nav>
    </div>

  </div>
