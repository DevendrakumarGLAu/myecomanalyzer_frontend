<div class="modal fade show d-block saas-backdrop" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-md">
    
    <div class="modal-content saas-modal">

      <!-- Header -->
      <div class="modal-header saas-header">
        <div>
          <h5 class="modal-title saas-title">
            {{ data.title || 'Confirmation' }}
          </h5>
          <p class="saas-subtitle">Please review this action carefully</p>
        </div>

        <button type="button" class="btn-close saas-close" (click)="cancel()"></button>
      </div>

      <!-- Body -->
      <div class="modal-body saas-body text-center">

        <div class="saas-message">
          {{ data.message }}
        </div>

        <div class="saas-warning">
          ⚠ This action cannot be undone
        </div>

        <!-- Checkbox -->
        <div class="form-check saas-check">
          <input
            class="form-check-input required-checkbox"
            type="checkbox"
            id="confirmCheck"
            [(ngModel)]="isChecked"
          />

          <label class="form-check-label saas-check-label" for="confirmCheck">
            I understand this action is irreversible
          </label>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer saas-footer">

        <button class="btn saas-btn-outline" (click)="cancel()">
          Cancel
        </button>

        <button
          class="btn saas-btn-primary"
          [ngClass]="getButtonClass()"
          (click)="confirm()"
          [disabled]="!isChecked"
        >
          {{ data.confirmButtonText || 'Confirm' }}
        </button>

      </div>

    </div>
  </div>
</div>
