<div class="chatbot-container">
    <!-- Chatbot Header -->
    <div class="chatbot-header" *ngIf="isOpen">
        <div class="header-content">
            <div class="chatbot-title">
                <!-- <i class="fa-solid fa-robot header-icon"></i> -->
                <span>Chat Assistant</span>
            </div>
            <div class="header-actions">
                <span class="btn-clear" (click)="clearChat()" title="Clear chat">
                    <i class="fa fa-trash"></i>
                </span>
                <span class="btn-close1 " (click)="toggleChatbot()" title="Close">
                    <i class="fa fa-times-circle"></i>
                </span>
            </div>
        </div>
    </div>

    <!-- Chatbot Body -->
    <div class="chatbot-body" *ngIf="isOpen">
        <!-- Messages Container -->
        <div class="chat-messages">
            <div *ngFor="let message of chatMessages" [ngClass]="'message message-' + message.sender">
                <div class="message-content">
                    <!-- <span *ngIf="message.sender === 'bot'" class="message-icon">
                        <i class="fa-solid fa-robot"></i>
                    </span> -->
                    <span *ngIf="message.sender === 'user'" class="message-icon">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <!-- Animated typing indicator while loading -->
                    <div class="typing-wrapper" *ngIf="message.text === '...'">

                        <div class="typing-avatar">
                            <i class="fa-solid fa-robot"></i>
                        </div>

                        <!-- <div class="typing-bubble"> -->

                            <div class="typing-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>

                            <!-- <div class="typing-text">
                                AI is typing...
                            </div> -->

                        <!-- </div> -->

                    </div>
                    <!-- Normal message text -->
                    <p class="message-text" *ngIf="message.text !== '...'">{{ message.text }}</p>
                </div>
                <small class="message-time" *ngIf="message.text !== '...'">{{ message.timestamp | date: 'short'
                    }}</small>
            </div>
        </div>

        <!-- Input Area -->
        <form class="chat-input-area" (ngSubmit)="sendMessage()">
            <input type="text" [(ngModel)]="userInput" name="chatInput" placeholder="Type your message..."
                class="chat-input" [disabled]="isLoading" />
            <button type="submit" class="btn-send" [disabled]="isLoading">
                <span *ngIf="isLoading">
                    <i class="fa-solid fa-stop"></i>
                </span>
                <i *ngIf="!isLoading" class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Collapsed View -->
    <div class="chatbot-collapsed" *ngIf="!isOpen" cdkDrag (cdkDragStarted)="onDragStarted()"
        (cdkDragEnded)="onDragEnded()" (click)="openChat()">
        <span class="chat-icon">💬</span>
    </div>
</div>
