  <div class="sidebar-user p-3 text-white">
    <div class="d-flex align-items-center">
      <div class="user-avatar brand-image opacity-75 me-2">
         {{ userInitial }}
      </div>

      <div class="user-info">
        <div class="fw-semibold"> {{ userName | titleCase }}</div>
        <small class="text-muted">Logged in</small>
      </div>
    </div>
  </div>

  <div class="sidebar-wrapper">
    <nav class="mt-2">
      <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu" data-accordion="false">
        <li class="nav-item" *ngFor="let item of menuItems; let i = index">
          <ng-container *ngIf="!item.children || !item.children.length; else submenu">
            <a [routerLink]="item.route" routerLinkActive="active" class="nav-link">
              <i class="nav-icon" [ngClass]="item.icon"></i>
              <p class="ml-2">{{ item.label }}</p>
            </a>
          </ng-container>

          <ng-template #submenu>
            <a class="nav-link nav-parent" role="button" (click)="toggleMenu(i)">
              <i class="nav-icon" [ngClass]="item.icon"></i>
              <p class="ml-2">
                {{ item.label }}
                <i class="nav-arrow fas ms-2"
                  [ngClass]="{ 'fa-angle-down': isMenuOpen(i), 'fa-angle-right': !isMenuOpen(i) }"></i>
              </p>
            </a>
            <ul class="nav nav-treeview ps-3" *ngIf="isMenuOpen(i)">
              <li class="nav-item" *ngFor="let child of item.children">
                <a [routerLink]="child.route" routerLinkActive="active" class="nav-link">
                  <i class="nav-icon" [ngClass]="child.icon"></i>
                  <p class="ml-2">{{ child.label }}</p>
                </a>
              </li>
            </ul>
          </ng-template>
        </li>
      </ul>
    </nav>
  </div>
</aside>
